name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ToDoBot.sln
      - run: dotnet build ToDoBot.sln --configuration Release --no-restore
      - run: dotnet test ToDoBot.sln --configuration Release --no-build
